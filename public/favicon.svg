  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Outer Shield Geometry -->
  <path d="M32 10L48 16V28C48 38.5 41.2 48.2 32 52C22.8 48.2 16 38.5 16 28V16L32 10Z" 
